
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Оформление заказа</title>
</head>
<body>

    <h1>Оформление заказа</h1>

    {% if success %}
        <p>Заказ успешно оформлен!</p>
        <p>Итоговая стоимость: {{ total }} сум</p>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Оформить заказ</button>
    </form>

    <a href="/">Вернуться в магазин</a>

</body>
</html>
